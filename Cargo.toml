[package]
name = "oriel"
version = "0.4.3"
edition = "2024"
description = "A fast terminal workspace: tabs, tmux-style split panes, and built-in apps (AI chat, music, system, files, notes, storage)"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
vt100 = "0.16"
notify = "8"
sysinfo = "0.39"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
ureq = "3"
dirs = "7"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
unicode-width = "0.2"
symphonia = { version = "0.5", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tga", "tiff"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
